 <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration & TinyDB Saver</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 380px;
    }

    h2 {
      color: #333333;
      margin-bottom: 20px;
      font-size: 1.4rem;
      text-align: center;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #555555;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
      background-color: #f9f9f9;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="password"]:focus,
    select:focus {
      border-color: #4e54c8;
      background-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4e54c8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.1s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #3b40a4;
    }

    button:active {
      transform: scale(0.98);
    }

    /* रिस्पॉन्स डिस्प्ले स्टाइल (डैशबोर्ड) */
    .dashboard {
      display: none;
    }

    .info-box {
      background-color: #f0f3ff;
      border-left: 4px solid #4e54c8;
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      text-align: left;
    }

    .info-box p {
      margin-bottom: 8px;
      color: #333;
      font-size: 0.95rem;
    }

    .info-box p:last-child {
      margin-bottom: 0;
    }

    .logout-btn {
      background-color: #e74c3c;
    }

    .logout-btn:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. लॉगिन / रजिस्ट्रेशन फ़ॉर्म -->
    <div id="loginForm">
      <h2>विद्यार्थी लॉगिन</h2>

      <div class="input-group">
        <label for="studentName">पूरा नाम (Name)</label>
        <input type="text" id="studentName" placeholder="अपना नाम लिखें...">
      </div>

      <div class="input-group">
        <label for="rollNumber">रोल नंबर (Roll No.)</label>
        <!-- only integers allowed -->
        <input type="number" id="rollNumber" placeholder="केवल अंक (e.g. 101)" step="1">
      </div>

      <div class="input-group">
        <label for="classSelect">कक्षा (Class)</label>
        <select id="classSelect">
          <option value="">-- कक्षा चुनें --</option>
          <option value="Class 1">कक्षा 1</option>
          <option value="Class 2">कक्षा 2</option>
          <option value="Class 3">कक्षा 3</option>
          <option value="Class 4">कक्षा 4</option>
          <option value="Class 5">कक्षा 5</option>
          <option value="Class 6">कक्षा 6</option>
          <option value="Class 7">कक्षा 7</option>
          <option value="Class 8">कक्षा 8</option>
          <option value="Class 9">कक्षा 9</option>
          <option value="Class 10">कक्षा 10</option>
        </select>
      </div>

      <div class="input-group">
        <label for="userPassword">पासवर्ड (Password)</label>
        <input type="password" id="userPassword" placeholder="पासवर्ड लिखें...">
      </div>

      <button type="button" onclick="saveAndLogin()">लॉगिन / सहेजें</button>
    </div>

    <!-- 2. डैशबोर्ड (डेटा सेव होने के बाद दिखेगा) -->
    <div id="dashboard" class="dashboard">
      <h2>सहेजी गई जानकारी</h2>
      
      <div class="info-box">
        <p><strong>नाम:</strong> <span id="displayName"></span></p>
        <p><strong>रोल नंबर:</strong> <span id="displayRoll"></span></p>
        <p><strong>कक्षा:</strong> <span id="displayClass"></span></p>
        <p><strong>पासवर्ड:</strong> <span id="displayPassword">******</span></p>
      </div>

      <button type="button" class="logout-btn" onclick="clearData()">डेटा साफ़ करें (Logout)</button>
    </div>

  </div>

  <script>
    // App Inventor / WebViewer / Browser डेटा प्राप्त करने का फ़ंक्शन
    function getStoredData() {
      let dataStr = "";
      if (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function') {
        dataStr = window.AppInventor.getWebViewString();
      } else if (window.WebViewerString) {
        dataStr = window.WebViewerString;
      } else {
        dataStr = localStorage.getItem("studentSavedData") || "";
      }
      return dataStr;
    }

    // App Inventor / WebViewer / Browser डेटा सेव करने का फ़ंक्शन
    function setStoredData(str) {
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString(str);
      } else {
        window.WebViewerString = str;
        localStorage.setItem("studentSavedData", str);
      }
    }

    // ऐप शुरू होते ही लोड करने वाला फ़ंक्शन
    function checkSavedUser() {
      const dataStr = getStoredData();

      if (dataStr && dataStr !== "null" && dataStr !== "undefined" && dataStr !== "") {
        try {
          const userData = JSON.parse(dataStr);
          if (userData && userData.name) {
            showDashboard(userData);
          }
        } catch (e) {
          console.error("JSON Parsing error:", e);
        }
      }
    }

    // बटन क्लिक होने पर डेटा सहेजने और लॉगिन करने का फ़ंक्शन
    function saveAndLogin() {
      const name = document.getElementById("studentName").value.trim();
      const roll = document.getElementById("rollNumber").value.trim();
      const studentClass = document.getElementById("classSelect").value;
      const password = document.getElementById("userPassword").value;

      // वैलिडेशन (जांच)
      if (!name) {
        alert("कृपया नाम दर्ज करें!");
        return;
      }
      if (!roll) {
        alert("कृपया रोल नंबर दर्ज करें!");
        return;
      }
      if (!studentClass) {
        alert("कृपया कक्षा चुनें!");
        return;
      }
      if (!password) {
        alert("कृपया पासवर्ड दर्ज करें!");
        return;
      }

      // डेटा ऑब्जेक्ट
      const userData = {
        name: name,
        roll: roll,
        class: studentClass,
        password: password
      };

      // डेटा को JSON स्ट्रिंग में बदलकर सेव करें
      const jsonString = JSON.stringify(userData);
      setStoredData(jsonString);

      // लॉगिन फ़ॉर्म छिपाएं और सहेजा हुआ डेटा दिखाएं
      showDashboard(userData);
    }

    // सहेजा हुआ डेटा स्क्रीन पर दिखाने का फ़ंक्शन
    function showDashboard(userData) {
      document.getElementById("displayName").innerText = userData.name;
      document.getElementById("displayRoll").innerText = userData.roll;
      document.getElementById("displayClass").innerText = userData.class;
      document.getElementById("displayPassword").innerText = "•".repeat(userData.password ? userData.password.length : 6);

      document.getElementById("loginForm").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    }

    // रिसेट / री-लॉगिन करने के लिए (टेस्टिंग के उद्देश्य से)
    function clearData() {
      setStoredData("");
      document.getElementById("studentName").value = "";
      document.getElementById("rollNumber").value = "";
      document.getElementById("classSelect").value = "";
      document.getElementById("userPassword").value = "";

      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
    }

    // पेज लोड होने पर अपने आप लोड चेक करें
    window.onload = checkSavedUser;
  </script>

</body>
</html>
