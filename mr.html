<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal - Glassmorphism</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('1000063888.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Glassmorphism Card */
    .card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 380px;
      color: #fff;
    }

    h2 {
      color: #1b4332;
      margin-bottom: 20px;
      font-size: 1.4rem;
      text-align: center;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #1b4332;
      font-weight: 700;
    }

    input[type="text"],
    input[type="number"],
    input[type="password"],
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.5);
      color: #000;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="password"]:focus,
    select:focus {
      border-color: #2d6a4f;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 8px rgba(45, 106, 79, 0.4);
    }

    select option {
      color: #333;
      background: #fff;
    }

    /* Error Message Style */
    .error-msg {
      color: #d90429;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2d6a4f, #52b788);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 5px;
      box-shadow: 0 4px 10px rgba(45, 106, 79, 0.3);
    }

    button:hover {
      background: linear-gradient(135deg, #1b4332, #40916c);
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    /* Dashboard Style */
    .dashboard {
      display: none;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.4);
      border-left: 5px solid #2d6a4f;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: left;
      backdrop-filter: blur(5px);
    }

    .info-box p {
      margin-bottom: 8px;
      color: #1b4332;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .info-box p span {
      font-weight: normal;
      color: #000;
    }

    .info-box p:last-child {
      margin-bottom: 0;
    }

    .logout-btn {
      background: linear-gradient(135deg, #d90429, #ef233c);
      box-shadow: 0 4px 10px rgba(217, 4, 41, 0.3);
    }

    .logout-btn:hover {
      background: linear-gradient(135deg, #c9184a, #d90429);
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- 1. Login Form -->
    <div id="loginForm">
      <h2>Student Login</h2>
      
      <!-- Error notification box -->
      <div id="errorBox" class="error-msg"></div>

      <div class="input-group">
        <label for="studentName">Full Name</label>
        <input type="text" id="studentName" placeholder="Enter your name...">
      </div>

      <div class="input-group">
        <label for="rollNumber">Roll Number</label>
        <input type="number" id="rollNumber" placeholder="Enter integers only..." step="1">
      </div>

      <div class="input-group">
        <label for="classSelect">Select Class</label>
        <select id="classSelect">
          <option value="">-- Select Class --</option>
          <option value="Class 1">Class 1</option>
          <option value="Class 2">Class 2</option>
          <option value="Class 3">Class 3</option>
          <option value="Class 4">Class 4</option>
          <option value="Class 5">Class 5</option>
          <option value="Class 6">Class 6</option>
          <option value="Class 7">Class 7</option>
          <option value="Class 8">Class 8</option>
          <option value="Class 9">Class 9</option>
          <option value="Class 10">Class 10</option>
        </select>
      </div>

      <div class="input-group">
        <label for="userPassword">Password</label>
        <input type="password" id="userPassword" placeholder="Enter password...">
      </div>

      <button type="button" onclick="saveAndLogin()">Login / Save</button>
    </div>

    <!-- 2. Dashboard (Visible after successful login/data load) -->
    <div id="dashboard" class="dashboard">
      <h2>Student Profile</h2>
      
      <div class="info-box">
        <p>Name: <span id="displayName"></span></p>
        <p>Roll No: <span id="displayRoll"></span></p>
        <p>Class: <span id="displayClass"></span></p>
        <p>Password: <span id="displayPassword">******</span></p>
      </div>

      <button type="button" class="logout-btn" onclick="clearData()">Clear Data / Logout</button>
    </div>

  </div>

  <script>
    function getStoredData() {
      let dataStr = "";
      if (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function') {
        dataStr = window.AppInventor.getWebViewString();
      } else if (window.WebViewerString) {
        dataStr = window.WebViewerString;
      } else {
        dataStr = localStorage.getItem("studentSavedData") || "";
      }
      return dataStr;
    }

    function setStoredData(str) {
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString(str);
      } else {
        window.WebViewerString = str;
        localStorage.setItem("studentSavedData", str);
      }
    }

    function checkSavedUser() {
      const dataStr = getStoredData();
      if (dataStr && dataStr !== "null" && dataStr !== "undefined" && dataStr !== "") {
        try {
          const userData = JSON.parse(dataStr);
          if (userData && userData.name) {
            showDashboard(userData);
          }
        } catch (e) {
          console.error("JSON Parsing error:", e);
        }
      }
    }

    function showError(message) {
      const errBox = document.getElementById("errorBox");
      errBox.innerText = message;
      errBox.style.display = "block";
    }

    function saveAndLogin() {
      const name = document.getElementById("studentName").value.trim();
      const roll = document.getElementById("rollNumber").value.trim();
      const studentClass = document.getElementById("classSelect").value;
      const password = document.getElementById("userPassword").value;

      // Validation check
      if (!name) {
        showError("Please enter your full name!");
        return;
      }
      if (!roll) {
        showError("Please enter a valid roll number!");
        return;
      }
      if (!studentClass) {
        showError("Please select a class!");
        return;
      }
      if (!password) {
        showError("Please enter your password!");
        return;
      }

      // Hide error if all fields are filled
      document.getElementById("errorBox").style.display = "none";

      const userData = { name, roll, class: studentClass, password };
      setStoredData(JSON.stringify(userData));
      showDashboard(userData);
    }

    function showDashboard(userData) {
      document.getElementById("displayName").innerText = userData.name;
      document.getElementById("displayRoll").innerText = userData.roll;
      document.getElementById("displayClass").innerText = userData.class;
      document.getElementById("displayPassword").innerText = "•".repeat(userData.password ? userData.password.length : 6);

      document.getElementById("loginForm").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    }

    function clearData() {
      setStoredData("");
      document.getElementById("studentName").value = "";
      document.getElementById("rollNumber").value = "";
      document.getElementById("classSelect").value = "";
      document.getElementById("userPassword").value = "";
      document.getElementById("errorBox").style.display = "none";

      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
    }

    window.onload = checkSavedUser;
  </script>

</body>
</html>
