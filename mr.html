 <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranjan Sir Academy - Simple Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 360px;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 16px;
      text-align: center;
      font-size: 1.3rem;
    }
    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #34495e;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus, select:focus {
      border-color: #16a085;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #16a085;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active {
      background-color: #117964;
    }
    .btn-danger {
      background-color: #e74c3c;
      margin-top: 8px;
    }
    .btn-danger:active {
      background-color: #c0392b;
    }
    .hidden {
      display: none !important;
    }
    .info-box {
      background: #eef2f5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN / SIGNUP SCREEN -->
  <div id="login-screen" class="card">
    <h2>Student Login / Register</h2>
    <div class="form-group">
      <label>नाम (Name)</label>
      <input type="text" id="input-name" placeholder="अपना नाम लिखें">
    </div>
    <div class="form-group">
      <label>रोल नंबर (Roll Number)</label>
      <input type="text" id="input-roll" placeholder="रोल नंबर लिखें">
    </div>
    <div class="form-group">
      <label>क्लास (Class)</label>
      <select id="input-class">
        <option value="1st Class">1st Class</option>
        <option value="2nd Class">2nd Class</option>
        <option value="3rd Class">3rd Class</option>
        <option value="4th Class">4th Class</option>
        <option value="5th Class">5th Class</option>
        <option value="6th Class">6th Class</option>
        <option value="7th Class">7th Class</option>
        <option value="8th Class">8th Class</option>
        <option value="9th Class">9th Class</option>
        <option value="10th Class" selected>10th Class</option>
      </select>
    </div>
    <div class="form-group">
      <label>पासवर्ड (Password)</label>
      <input type="password" id="input-pass" placeholder="पासवर्ड दर्ज करें">
    </div>
    <button type="button" onclick="saveAndLogin()">लॉगिन / सेव करें</button>
  </div>

  <!-- 2. HOME SCREEN (DATA DISPLAY) -->
  <div id="home-screen" class="card hidden">
    <h2>स्वागत है, छात्र!</h2>
    <div class="info-box" id="display-user-info">
      <!-- यहाँ सेव किया हुआ डेटा दिखेगा -->
    </div>
    <button type="button" class="btn-danger" onclick="handleLogout()">लॉग आउट (Logout)</button>
  </div>

  <script>
    let currentUser = null;

    // ऐप इनवेंटर या लोकलस्टोरेज से डेटा प्राप्त करने का फंक्शन
    function getStoredData() {
      let data = "";
      if (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function') {
        data = window.AppInventor.getWebViewString();
      } else if (window.WebViewerString) {
        data = window.WebViewerString;
      } else {
        data = localStorage.getItem('simple_user_profile') || "";
      }
      return data;
    }

    // डेटा को TinyDB / WebViewString में भेजने का पक्का फंक्शन (टेस्ट कोड की तरह)
    function storeDataToApp(dataString) {
      localStorage.setItem('simple_user_profile', dataString);
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString(dataString);
      } else {
        window.WebViewerString = dataString;
      }
    }

    // होम स्क्रीन पर डेटा दिखाने का फंक्शन
    function showHomeScreen(user) {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('home-screen').classList.remove('hidden');

      const infoBox = document.getElementById('display-user-info');
      infoBox.innerHTML = `
        <p><b>नाम:</b> ${user.name}</p>
        <p><b>रोल नंबर:</b> ${user.roll}</p>
        <p><b>क्लास:</b> ${user.classVal}</p>
        <p><b>पासवर्ड:</b> ${user.password}</p>
      `;
    }

    // ऐप इनिशियलाइज होते ही चेक करें (ऑटो-लॉगिन)
    function checkAutoLogin() {
      let rawData = getStoredData();
      if (rawData && rawData !== "" && rawData !== "{}") {
        try {
          currentUser = JSON.parse(rawData);
          if (currentUser && currentUser.roll) {
            showHomeScreen(currentUser);
          }
        } catch (e) {
          // यदि प्लेन टेक्स्ट या पुराना फॉर्मेट हो
        }
      }
    }

    // ऐप इनवेंटर ब्रिज फंक्शन (अगर डेटा बाहर से बदले)
    function NativeWebViewStringChanged(val) {
      if (val && val !== "" && val !== "{}") {
        try {
          let parsed = JSON.parse(val);
          if (parsed && parsed.roll) {
            currentUser = parsed;
            showHomeScreen(currentUser);
          }
        } catch (e) {}
      }
    }

    // लॉगिन बटन दबाने पर
    function saveAndLogin() {
      const name = document.getElementById('input-name').value.trim();
      const roll = document.getElementById('input-roll').value.trim();
      const classVal = document.getElementById('input-class').value;
      const pass = document.getElementById('input-pass').value.trim();

      if (!name || !roll || !pass) {
        alert("कृपया सभी जानकारी भरें!");
        return;
      }

      currentUser = { name, roll, classVal, password: pass };
      const jsonString = JSON.stringify(currentUser);

      // डेटा स्टोर करें
      storeDataToApp(jsonString);

      // होम स्क्रीन पर जाएँ
      showHomeScreen(currentUser);
      alert("डेटा सफलतापूर्वक सेव हो गया!");
    }

    // लॉग आउट बटन
    function handleLogout() {
      currentUser = null;
      storeDataToApp("");
      document.getElementById('home-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    // पेज लोड होते ही चेक करें
    window.onload = checkAutoLogin;
  </script>
</body>
</html>
