<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Portal - Firebase</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: linear-gradient(135deg, #0d3b2e, #11998e, #38ef7d);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Top Custom Popup Notification */
    #customPopup {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 59, 46, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 239, 125, 0.5);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 1000;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      letter-spacing: 0.5px;
    }

    #customPopup.show {
      top: 25px;
    }

    /* Progress Bar Overlay */
    #progressBarContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: transparent;
      overflow: hidden;
      border-radius: 28px 28px 0 0;
      display: none;
      z-index: 100;
    }

    .progress-bar {
      width: 100%;
      height: 100%;
      background: #38ef7d;
      animation: indeterminate 1.5s infinite linear;
      transform-origin: left;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%) scaleX(0.2); }
      50% { transform: translateX(0%) scaleX(0.8); }
      100% { transform: translateX(100%) scaleX(0.2); }
    }

    /* 3D Glassmorphism Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.15);
      border-right: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4),
                  inset 0 2px 4px rgba(255, 255, 255, 0.6),
                  inset 0 -2px 4px rgba(0, 0, 0, 0.2);
      transform: perspective(1000px);
      transition: all 0.4s ease;
      position: relative;
    }

    /* Tab Switcher Header */
    .tab-header {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .input-group {
      margin-bottom: 18px;
      position: relative;
    }

    .input-group label {
      display: block;
      color: rgba(255, 255, 255, 0.95);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      margin-left: 4px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .input-field {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      font-size: 0.95rem;
      color: #ffffff;
      outline: none;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.15);
      -webkit-user-select: text;
      user-select: text;
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .input-field:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: #38ef7d;
      box-shadow: 0 0 15px rgba(56, 239, 125, 0.5), inset 0 2px 5px rgba(0, 0, 0, 0.15);
    }

    /* Custom 3D Glass Dropdown UI */
    .custom-dropdown {
      position: relative;
    }

    .select-trigger {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.15);
    }

    .select-trigger.selected {
      color: #ffffff;
    }

    .select-trigger:after {
      content: '▼';
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.9);
      transition: transform 0.3s ease;
    }

    .custom-dropdown.open .select-trigger:after {
      transform: rotate(180deg);
    }

    .custom-dropdown.open .select-trigger {
      background: rgba(255, 255, 255, 0.3);
      border-color: #38ef7d;
      box-shadow: 0 0 15px rgba(56, 239, 125, 0.5);
    }

    .dropdown-menu {
      position: absolute;
      top: 110%;
      left: 0;
      right: 0;
      background: rgba(13, 59, 46, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      max-height: 180px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .custom-dropdown.open .dropdown-menu {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .dropdown-option {
      padding: 12px 16px;
      color: #ffffff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease, padding-left 0.2s ease;
    }

    .dropdown-option:hover {
      background: rgba(56, 239, 125, 0.35);
      padding-left: 22px;
      color: #38ef7d;
    }

    .dropdown-menu::-webkit-scrollbar {
      width: 6px;
    }

    .dropdown-menu::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 4px;
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* 3D Deep Embossed Glass Button */
    .btn-action {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: linear-gradient(135deg, #38ef7d, #11998e);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(17, 153, 142, 0.5),
                  0 5px 0px #0b544d,
                  inset 0 2px 3px rgba(255, 255, 255, 0.6);
      transition: all 0.15s ease;
      text-transform: uppercase;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(17, 153, 142, 0.6),
                  0 7px 0px #0b544d,
                  inset 0 2px 3px rgba(255, 255, 255, 0.6);
    }

    .btn-action:active {
      transform: translateY(3px);
      box-shadow: 0 4px 12px rgba(17, 153, 142, 0.4),
                  0 2px 0px #0b544d,
                  inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <!-- Top Floating Popup Notice -->
  <div id="customPopup">Notification Message</div>

  <!-- MAIN CARD CONTAINER -->
  <div class="glass-card">
    <!-- Progress Bar -->
    <div id="progressBarContainer">
      <div class="progress-bar"></div>
    </div>

    <!-- Tab Switcher -->
    <div class="tab-header">
      <button class="tab-btn active" id="tabCreateBtn" onclick="switchTab('create')">Create Account</button>
      <button class="tab-btn" id="tabLoginBtn" onclick="switchTab('login')">Login</button>
    </div>

    <!-- CREATE ACCOUNT FORM -->
    <div class="form-section active" id="createSection">
      <div class="input-group">
        <label for="regName">Name</label>
        <input type="text" id="regName" class="input-field" placeholder="Enter full name" autocomplete="off">
      </div>

      <div class="input-group">
        <label for="regRoll">Roll Number</label>
        <input type="number" id="regRoll" class="input-field" placeholder="Enter numeric roll no" autocomplete="off">
      </div>

      <div class="input-group">
        <label>Class</label>
        <div class="custom-dropdown" id="customDropdown">
          <div class="select-trigger" id="selectTrigger">Select Class</div>
          <div class="dropdown-menu">
            <div class="dropdown-option" data-value="Class 1">Class 1</div>
            <div class="dropdown-option" data-value="Class 2">Class 2</div>
            <div class="dropdown-option" data-value="Class 3">Class 3</div>
            <div class="dropdown-option" data-value="Class 4">Class 4</div>
            <div class="dropdown-option" data-value="Class 5">Class 5</div>
            <div class="dropdown-option" data-value="Class 6">Class 6</div>
            <div class="dropdown-option" data-value="Class 7">Class 7</div>
            <div class="dropdown-option" data-value="Class 8">Class 8</div>
            <div class="dropdown-option" data-value="Class 9">Class 9</div>
            <div class="dropdown-option" data-value="Class 10">Class 10</div>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label for="regPass">Password</label>
        <input type="password" id="regPass" class="input-field" placeholder="Enter password">
      </div>

      <button type="button" class="btn-action" onclick="handleCreateAccount()">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-section" id="loginSection">
      <div class="input-group">
        <label for="loginName">Name</label>
        <input type="text" id="loginName" class="input-field" placeholder="Enter full name" autocomplete="off">
      </div>

      <div class="input-group">
        <label for="loginRoll">Roll Number</label>
        <input type="number" id="loginRoll" class="input-field" placeholder="Enter numeric roll no" autocomplete="off">
      </div>

      <div class="input-group">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" class="input-field" placeholder="Enter password">
      </div>

      <button type="button" class="btn-action" onclick="handleLogin()">Login</button>
    </div>
  </div>

  <script>
    const FIREBASE_URL = "https://live-app-bdba9-default-rtdb.firebaseio.com/students";
    let selectedClassValue = "";

    function showPopup(message) {
      const popup = document.getElementById('customPopup');
      popup.innerText = message;
      popup.classList.add('show');
      setTimeout(() => {
        popup.classList.remove('show');
      }, 3000);
    }

    function toggleProgress(show) {
      document.getElementById('progressBarContainer').style.display = show ? 'block' : 'none';
    }

    function switchTab(tab) {
      const createSec = document.getElementById('createSection');
      const loginSec = document.getElementById('loginSection');
      const createBtn = document.getElementById('tabCreateBtn');
      const loginBtn = document.getElementById('tabLoginBtn');

      if (tab === 'create') {
        createSec.classList.add('active');
        loginSec.classList.remove('active');
        createBtn.classList.add('active');
        loginBtn.classList.remove('active');
      } else {
        loginSec.classList.add('active');
        createSec.classList.remove('active');
        loginBtn.classList.add('active');
        createBtn.classList.remove('active');
      }
    }

    // Custom Dropdown logic
    const dropdown = document.getElementById('customDropdown');
    const trigger = document.getElementById('selectTrigger');
    const options = document.querySelectorAll('.dropdown-option');

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.toggle('open');
    });

    options.forEach(option => {
      option.addEventListener('click', () => {
        selectedClassValue = option.getAttribute('data-value');
        trigger.innerText = selectedClassValue;
        trigger.classList.add('selected');
        dropdown.classList.remove('open');
      });
    });

    document.addEventListener('click', () => {
      dropdown.classList.remove('open');
    });

    // Auto-load data from TinyDB / WebViewString for Auto-Fill
    window.onload = function() {
      let savedDataRaw = "";
      if (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function') {
        savedDataRaw = window.AppInventor.getWebViewString();
      } else if (window.WebViewerString) {
        savedDataRaw = window.WebViewerString;
      } else {
        savedDataRaw = localStorage.getItem("studentData") || "";
      }

      if (savedDataRaw && savedDataRaw !== "null" && savedDataRaw !== "undefined" && savedDataRaw !== "close_webviewer") {
        try {
          const userData = JSON.parse(savedDataRaw);
          if (userData.roll) {
            document.getElementById("regName").value = userData.name || "";
            document.getElementById("regRoll").value = userData.roll || "";
            document.getElementById("regPass").value = userData.password || "";
            if(userData.studentClass) {
              selectedClassValue = userData.studentClass;
              trigger.innerText = selectedClassValue;
              trigger.classList.add('selected');
            }

            document.getElementById("loginName").value = userData.name || "";
            document.getElementById("loginRoll").value = userData.roll || "";
            document.getElementById("loginPass").value = userData.password || "";
          }
        } catch(e) {
          console.log("Auto-fill parsing error", e);
        }
      }
    };

    // Save data to TinyDB / WebViewString
    function saveToTinyDB(userDataObj) {
      const userDataString = JSON.stringify(userDataObj);
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString(userDataString);
      } else {
        window.WebViewerString = userDataString;
        localStorage.setItem("studentData", userDataString);
      }
    }

    // Trigger close instruction for App Inventor layout removal
    function sendCloseInstruction() {
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString("close_webviewer");
      } else {
        window.WebViewerString = "close_webviewer";
        showPopup("Instruction sent: close_webviewer");
      }
    }

    // Handle Create Account with strict matching of Name, Roll, Class, Password
    async function handleCreateAccount() {
      const name = document.getElementById("regName").value.trim();
      const roll = document.getElementById("regRoll").value.trim();
      const password = document.getElementById("regPass").value.trim();

      if (!name || !roll || !selectedClassValue || !password) {
        showPopup("Please fill in all details!");
        return;
      }

      toggleProgress(true);

      try {
        let response = await fetch(`${FIREBASE_URL}/${roll}.json`);
        let existingData = await response.json();

        if (existingData) {
          // Strict check: if Name, Roll, Class and Password all match completely
          if (
            existingData.name.toLowerCase() === name.toLowerCase() &&
            existingData.roll.toString() === roll.toString() &&
            existingData.studentClass === selectedClassValue &&
            existingData.password === password
          ) {
            toggleProgress(false);
            showPopup("Profile already exists with exact same details!");
            return;
          }
        }

        // Save or Overwrite profile to Firebase
        const studentData = { name, roll, studentClass: selectedClassValue, password };
        let saveRes = await fetch(`${FIREBASE_URL}/${roll}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(studentData)
        });

        if (saveRes.ok) {
          saveToTinyDB(studentData);
          toggleProgress(false);
          showPopup("Account created successfully!");
          setTimeout(sendCloseInstruction, 1000);
        } else {
          toggleProgress(false);
          showPopup("Failed to save data. Try again!");
        }
      } catch (err) {
        toggleProgress(false);
        showPopup("Network error! Check connection.");
      }
    }

    // Handle Login with strict verification of Name, Roll Number and Password
    async function handleLogin() {
      const name = document.getElementById("loginName").value.trim();
      const roll = document.getElementById("loginRoll").value.trim();
      const password = document.getElementById("loginPass").value.trim();

      if (!name || !roll || !password) {
        showPopup("Please fill in Name, Roll Number, and Password!");
        return;
      }

      toggleProgress(true);

      try {
        let response = await fetch(`${FIREBASE_URL}/${roll}.json`);
        let userData = await response.json();

        toggleProgress(false);

        if (!userData) {
          showPopup("Invalid Roll Number or Profile does not exist!");
          return;
        }

        // Strict verification: Name, Roll Number, and Password must match completely
        if (
          userData.roll.toString() === roll.toString() &&
          userData.name.toLowerCase() === name.toLowerCase() &&
          userData.password === password
        ) {
          saveToTinyDB(userData);
          showPopup("Login successful!");
          setTimeout(sendCloseInstruction, 1000);
        } else {
          showPopup("Invalid Name, Roll Number, or Password!");
        }
      } catch (err) {
        toggleProgress(false);
        showPopup("Network error! Check connection.");
      }
    }
  </script>

</body>
</html>
