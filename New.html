<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>Ranjan Sir Academy - Student Portal Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    input, select, textarea { 
      user-select: text; 
      -webkit-user-select: text;
    }

    :root {
      --bg-gradient: radial-gradient(circle at 40% 30%, #dbe8df, #9cb3a8);
      --text-dark: #1f3a2b;
      --text-muted: #3d5e4a;
      --card-border: rgba(255, 255, 255, 0.75);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--text-dark);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-gradient);
    }

    #global-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #10b981, #3b82f6, #10b981);
      background-size: 200% 100%;
      z-index: 99999999;
      display: none;
      animation: shimmerProgress 1.5s infinite linear;
    }
    @keyframes shimmerProgress {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .top-bar {
      padding: 14px 20px;
      background: rgba(220, 240, 225, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      border-bottom: 1.5px solid var(--card-border);
      box-shadow: 0 8px 20px rgba(20, 45, 30, 0.08);
    }

    .brand-area { display: flex; align-items: center; gap: 8px; }
    .top-bar h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-dark);
      text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.8);
    }

    #custom-toast {
      position: fixed;
      top: -70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(225, 250, 230, 0.95);
      border: 1.5px solid var(--card-border);
      color: var(--text-dark);
      padding: 12px 22px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: inset -4px -5px 8px rgba(30, 70, 50, 0.2), inset 4px 5px 8px rgba(255, 255, 255, 0.9), 0 12px 20px rgba(15, 35, 15, 0.15);
      backdrop-filter: blur(16px);
      z-index: 9999999;
      transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    #custom-toast.show { top: 20px; }
    #custom-toast i { color: #2e6618; font-size: 1.1rem; }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 140px;
      scroll-behavior: smooth;
      z-index: 10;
      -webkit-overflow-scrolling: touch;
    }
    .content-area::-webkit-scrollbar { display: none; }

    .view-section { display: none; }
    .view-section.active { display: block; animation: viewIn 0.2s ease-out; }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: rgba(215, 242, 222, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--card-border);
      border-radius: 28px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: inset -6px -8px 12px rgba(30, 70, 50, 0.15), inset 6px 8px 12px rgba(255, 255, 255, 0.85), 0 12px 20px -4px rgba(20, 45, 30, 0.12);
    }

    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; }
    
    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      padding: 12px 16px;
      color: var(--text-dark);
      outline: none;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: inset 2px 3px 6px rgba(20, 45, 30, 0.1);
    }
    .input-field option { background: #d4e7dc; color: var(--text-dark); font-weight: 600; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      background: rgba(200, 240, 208, 0.65);
      backdrop-filter: blur(12px);
      color: #1f3a2b;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: inset -4px -5px 8px rgba(30, 70, 50, 0.2), inset 4px 5px 8px rgba(255, 255, 255, 0.9), 0 8px 15px -3px rgba(20, 45, 30, 0.15);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-submit:active { transform: translateY(4px) scale(0.97); }
    .btn-disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }
    .btn-danger { background: rgba(239, 68, 68, 0.25); border-color: rgba(239, 68, 68, 0.5); color: #b91c1c; }
    .btn-secondary { background: rgba(185, 220, 238, 0.65); color: #1e3a8a; border-color: rgba(255,255,255,0.85); }

    .dp-wrapper {
      position: relative;
      display: inline-block;
    }

    .avatar-grid { 
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 8px; 
      max-height: 180px; overflow-y: auto; padding: 6px; background: rgba(255,255,255,0.4); border-radius: 16px;
    }
    .avatar-grid::-webkit-scrollbar { width: 4px; }
    .avatar-grid::-webkit-scrollbar-thumb { background: rgba(30, 70, 50, 0.2); border-radius: 10px; }
    .avatar-option { 
      width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--card-border); 
      cursor: pointer; object-fit: cover; background: rgba(255,255,255,0.7);
      transition: transform 0.18s ease;
    }
    .avatar-option.selected { border-color: #15803d; transform: scale(1.15); background: rgba(185, 232, 198, 0.95); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(20, 45, 30, 0.45); display: none; justify-content: center; align-items: center; z-index: 999999; backdrop-filter: blur(10px);
    }
    .modal-card {
      background: rgba(225, 248, 230, 0.98); border: 1.5px solid var(--card-border); padding: 22px; border-radius: 32px; width: 90%; max-width: 360px; text-align: center;
    }

    .auth-tab-bar { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px; }
    .auth-tab { flex: 1; padding: 8px; text-align: center; font-weight: 800; cursor: pointer; color: var(--text-muted); border-radius: 12px; }
    .auth-tab.active { background: rgba(185, 232, 198, 0.9); color: var(--text-dark); }
  </style>
</head>
<body>

  <div id="global-progress-bar"></div>

  <div id="custom-toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-message">Notification</span>
  </div>

  <!-- AUTHENTICATION MODAL (LOGIN / SIGNUP) -->
  <div id="auth-modal" class="modal-overlay" style="display: flex;">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h2 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 4px;">Ranjan Sir Academy</h2>
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px;">Welcome! Log in or create an account</p>
      
      <div class="auth-tab-bar">
        <div id="tab-btn-login" class="auth-tab active" onclick="switchAuthMode('login')">Log In</div>
        <div id="tab-btn-signup" class="auth-tab" onclick="switchAuthMode('signup')">Create Account</div>
      </div>

      <!-- LOGIN FORM -->
      <div id="auth-form-login">
        <div class="form-group"><label>Student Name</label><input type="text" id="login-name" class="input-field" placeholder="Enter Your Name"></div>
        <div class="form-group"><label>Roll Number</label><input type="text" id="login-roll" class="input-field" placeholder="Enter Roll Number"></div>
        <div class="form-group">
          <label>Class</label>
          <select id="login-class" class="input-field">
            <option value="1st Class">1st Class</option>
            <option value="2nd Class">2nd Class</option>
            <option value="3rd Class">3rd Class</option>
            <option value="4th Class">4th Class</option>
            <option value="5th Class">5th Class</option>
            <option value="6th Class">6th Class</option>
            <option value="7th Class">7th Class</option>
            <option value="8th Class">8th Class</option>
            <option value="9th Class">9th Class</option>
            <option value="10th Class" selected>10th Class</option>
          </select>
        </div>
        <div class="form-group"><label>Password</label><input type="password" id="login-pass" class="input-field" placeholder="Enter Password"></div>
        <button class="btn-submit" type="button" onclick="handleLogin()">Log In</button>
      </div>

      <!-- CREATE ACCOUNT FORM -->
      <div id="auth-form-signup" style="display: none;">
        <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" class="input-field" placeholder="Your Name"></div>
        <div class="form-group"><label>Roll Number / User ID</label><input type="text" id="reg-id" class="input-field" placeholder="Create Roll / ID"></div>
        <div class="form-group">
          <label>Class</label>
          <select id="reg-class" class="input-field">
            <option value="1st Class">1st Class</option>
            <option value="2nd Class">2nd Class</option>
            <option value="3rd Class">3rd Class</option>
            <option value="4th Class">4th Class</option>
            <option value="5th Class">5th Class</option>
            <option value="6th Class">6th Class</option>
            <option value="7th Class">7th Class</option>
            <option value="8th Class">8th Class</option>
            <option value="9th Class">9th Class</option>
            <option value="10th Class" selected>10th Class</option>
          </select>
        </div>
        <div class="form-group"><label>Create Password</label><input type="password" id="reg-pass" class="input-field" placeholder="Create Password"></div>
        <button class="btn-submit" type="button" onclick="handleSignUp()">Create Account & Login</button>
      </div>
    </div>
  </div>

  <!-- SYNC DP POPUP MODAL -->
  <div id="sync-dp-modal" class="modal-overlay">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 6px;">Update Profile Picture</h3>
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 16px;">After selecting your DP in the editor link, tap Scan & Update to sync it to TinyDB.</p>
      <div style="background: rgba(255,255,255,0.6); border-radius: 12px; height: 10px; overflow: hidden; margin-bottom: 14px;">
        <div id="sync-progress-fill" style="width: 0%; height: 100%; background: #15803d; transition: width 0.3s ease;"></div>
      </div>
      <button class="btn-submit" type="button" onclick="executeScanAndSyncDp()" style="margin-bottom: 8px;"><i class="fa-solid fa-qrcode"></i> Scan & Update DP</button>
      <button class="btn-submit btn-secondary" type="button" onclick="closeSyncDpModal()">Close</button>
    </div>
  </div>

  <div class="app-container">
    <div class="top-bar">
      <div class="brand-area">
        <h2>Ranjan Sir Academy</h2>
      </div>
      <div id="user-badge-status" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">Guest</div>
    </div>

    <div class="content-area">
      <!-- PROFILE EDIT VIEW -->
      <div id="view-profile" class="view-section active">
        <div class="card" style="text-align: center;">
          <div style="position: relative; display: inline-block; margin-bottom: 10px;">
            <div class="dp-wrapper">
              <img id="profile-preview-dp" src="https://api.dicebear.com/7.x/micah/svg?seed=Default" style="width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--card-border); object-fit: cover;">
            </div>
            <div onclick="openDpActivityStarter()" style="position: absolute; bottom: 0; right: 0; background: #15803d; color: #fff; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
              <i class="fa-solid fa-pencil" style="font-size: 0.8rem;"></i>
            </div>
          </div>

          <h3 id="profile-preview-name" style="font-weight: 800; font-size: 1.1rem; margin-bottom: 4px;">Student Name</h3>
          <p id="profile-preview-roll" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-bottom: 15px;">Roll: -</p>

          <div class="form-group"><label>Full Name</label><input type="text" id="prof-input-name" class="input-field"></div>
          <div class="form-group"><label>Password</label><input type="password" id="prof-input-pass" class="input-field"></div>
          
          <div class="form-group">
            <label>Class</label>
            <select id="prof-input-class" class="input-field">
              <option value="1st Class">1st Class</option>
              <option value="2nd Class">2nd Class</option>
              <option value="3rd Class">3rd Class</option>
              <option value="4th Class">4th Class</option>
              <option value="5th Class">5th Class</option>
              <option value="6th Class">6th Class</option>
              <option value="7th Class">7th Class</option>
              <option value="8th Class">8th Class</option>
              <option value="9th Class">9th Class</option>
              <option value="10th Class" selected>10th Class</option>
            </select>
          </div>

          <div class="form-group">
            <label>Choose Avatar (Avatars Available)</label>
            <div class="avatar-grid" id="avatar-selector-grid"></div>
          </div>

          <button class="btn-submit" type="button" onclick="updateUserProfile()" style="margin-top: 10px;"><i class="fa-solid fa-floppy-disk"></i> Update Profile</button>
          <button class="btn-submit btn-secondary" type="button" onclick="openDpActivityStarter()" style="margin-top: 10px;"><i class="fa-solid fa-image"></i> Open DP Editor Link</button>
          <button class="btn-submit btn-danger" type="button" onclick="handleLogOut()" style="margin-top: 10px;"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_URL = "https://live-app-bdba9-default-rtdb.firebaseio.com/";
    let currentUser = null;

    function showToast(msg) {
      const toast = document.getElementById('custom-toast');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    function toggleProgressBar(show) {
      const bar = document.getElementById('global-progress-bar');
      if (bar) bar.style.display = show ? 'block' : 'none';
    }

    function switchAuthMode(mode) {
      if (mode === 'login') {
        document.getElementById('tab-btn-login').classList.add('active');
        document.getElementById('tab-btn-signup').classList.remove('active');
        document.getElementById('auth-form-login').style.display = 'block';
        document.getElementById('auth-form-signup').style.display = 'none';
      } else {
        document.getElementById('tab-btn-signup').classList.add('active');
        document.getElementById('tab-btn-login').classList.remove('active');
        document.getElementById('auth-form-signup').style.display = 'block';
        document.getElementById('auth-form-login').style.display = 'none';
      }
    }

    function openDpActivityStarter() {
      const dpUrl = "https://ankeshkumar631-ui.github.io/RNS-live/dp.html";
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.location.href = dpUrl;
      } else {
        window.open(dpUrl, '_blank');
      }
      openSyncProgressModal();
    }

    function openSyncProgressModal() {
      const modal = document.getElementById('sync-dp-modal');
      const fill = document.getElementById('sync-progress-fill');
      modal.style.display = 'flex';
      fill.style.width = '0%';
    }

    function executeScanAndSyncDp() {
      const fill = document.getElementById('sync-progress-fill');
      fill.style.width = '50%';
      toggleProgressBar(true);
      setTimeout(() => {
        fill.style.width = '100%';
        syncDpFromFirebase();
      }, 500);
    }

    function closeSyncDpModal() {
      document.getElementById('sync-dp-modal').style.display = 'none';
      toggleProgressBar(false);
    }

    async function syncDpFromFirebase() {
      if (!currentUser || !currentUser.id) {
        showToast('Please login first to sync DP.');
        closeSyncDpModal();
        return;
      }
      try {
        let res = await fetch(`${FIREBASE_URL}/UsersMap/${currentUser.id}.json`);
        let freshData = await res.json();
        if (freshData && freshData.dp) {
          currentUser.dp = freshData.dp;
          document.getElementById('profile-preview-dp').src = currentUser.dp;
          saveUserProfileToDb();
          showToast('DP Synced Successfully & Saved to TinyDB!');
        } else {
          showToast('No updated DP found on Firebase yet.');
        }
      } catch (e) {
        showToast('Failed to sync DP.');
      } finally {
        toggleProgressBar(false);
        closeSyncDpModal();
      }
    }

    // TinyDB & App Inventor WebViewString Sync
    function saveUserProfileToDb() {
      if (!currentUser) return;
      const dataStr = JSON.stringify(currentUser);
      localStorage.setItem('saved_user_profile', dataStr);
      
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString(dataStr);
      } else {
        window.WebViewerString = dataStr;
      }
    }

    // Auto-Login & Auto-Fill Check on App Startup
    window.onload = () => {
      try {
        let webViewData = window.WebViewerString || (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function' ? window.AppInventor.getWebViewString() : null);
        
        if (!webViewData || webViewData === "" || webViewData === "{}") {
          webViewData = localStorage.getItem('saved_user_profile');
        }

        if (webViewData && webViewData !== "{}") {
          const parsedUser = JSON.parse(webViewData);
          if (parsedUser && parsedUser.id) {
            currentUser = parsedUser;
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('user-badge-status').innerText = currentUser.name || 'Student';
            populateProfileForm();
            
            // डेटा मिलते ही ऑटो-लॉगिन सिग्नल भेजें ताकि लेआउट स्विच हो सके
            if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
              window.AppInventor.setWebViewString("close_webviewer");
            } else {
              window.WebViewerString = "close_webviewer";
            }
            return;
          }
        }
      } catch (e) {}

      document.getElementById('auth-modal').style.display = 'flex';
      switchAuthMode('login');
    };

    function initAvatarGrid() {
      const grid = document.getElementById('avatar-selector-grid');
      if (!grid) return;
      grid.innerHTML = '';
      const styles = ['micah', 'adventurer', 'fun-emoji', 'avataaars', 'open-peeps', 'personas', 'bottts'];

      for (let i = 1; i <= 50; i++) {
        const style = styles[i % styles.length];
        const seed = `RanjanAcademyAvatar_${i}`;
        const url = `https://api.dicebear.com/7.x/${style}/svg?seed=${seed}`;

        const img = document.createElement('img');
        img.src = url;
        img.className = 'avatar-option' + (currentUser && currentUser.dp === url ? ' selected' : '');
        img.onclick = () => {
          document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
          img.classList.add('selected');
          if (currentUser) {
            currentUser.dp = url;
            document.getElementById('profile-preview-dp').src = url;
          }
        };
        grid.appendChild(img);
      }
    }

    function populateProfileForm() {
      if (!currentUser) return;
      document.getElementById('prof-input-name').value = currentUser.name || '';
      document.getElementById('prof-input-pass').value = currentUser.password || '';
      document.getElementById('prof-input-class').value = currentUser.classVal || '10th Class';
      document.getElementById('profile-preview-name').innerText = currentUser.name;
      document.getElementById('profile-preview-roll').innerText = `Roll: ${currentUser.roll || 'N/A'} | Class: ${currentUser.classVal || '10th Class'}`;
      document.getElementById('profile-preview-dp').src = currentUser.dp || 'https://api.dicebear.com/7.x/micah/svg?seed=Default';
      initAvatarGrid();
    }

    async function updateUserProfile() {
      if (!currentUser) return;
      currentUser.name = document.getElementById('prof-input-name').value.trim();
      currentUser.password = document.getElementById('prof-input-pass').value.trim();
      currentUser.classVal = document.getElementById('prof-input-class').value.trim();

      document.getElementById('user-badge-status').innerText = currentUser.name;
      document.getElementById('profile-preview-name').innerText = currentUser.name;

      toggleProgressBar(true);
      await fetch(`${FIREBASE_URL}/UsersMap/${currentUser.id}.json`, { method: 'PUT', body: JSON.stringify(currentUser) });
      toggleProgressBar(false);

      saveUserProfileToDb();
      showToast('Profile & DP Updated Successfully!');
    }

    function handleLogOut() {
      currentUser = null;
      localStorage.removeItem('saved_user_profile');
      
      if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
        window.AppInventor.setWebViewString("");
      } else {
        window.WebViewerString = "";
      }

      document.getElementById('user-badge-status').innerText = 'Guest';
      document.getElementById('auth-modal').style.display = 'flex';
      showToast('Logged out successfully.');
    }

    // Login with strict validation (Name, Roll, Class, Password)
    async function handleLogin() {
      const nameInput = document.getElementById('login-name').value.trim();
      const rollInput = document.getElementById('login-roll').value.trim();
      const classInput = document.getElementById('login-class').value;
      const passInput = document.getElementById('login-pass').value.trim();

      if (!nameInput || !rollInput || !passInput) { 
        showToast('Please fill all login fields'); 
        return; 
      }

      toggleProgressBar(true);
      let res = await fetch(`${FIREBASE_URL}/UsersMap/${rollInput}.json`);
      let uData = await res.json();
      toggleProgressBar(false);

      if (uData && uData.password === passInput) {
        if (
          uData.name && uData.name.trim().toLowerCase() === nameInput.toLowerCase() &&
          uData.classVal === classInput
        ) {
          currentUser = uData;
          document.getElementById('auth-modal').style.display = 'none';
          document.getElementById('user-badge-status').innerText = currentUser.name;
          populateProfileForm();
          
          saveUserProfileToDb();
          showToast(`Welcome back, ${currentUser.name}!`);

          // सिग्नल भेजें ताकि ऐप इन्वेंटर लेआउट हटा सके
          setTimeout(() => {
            if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
              window.AppInventor.setWebViewString("close_webviewer");
            } else {
              window.WebViewerString = "close_webviewer";
            }
          }, 800);

        } else {
          showToast('Invalid Name or Class match for this Roll Number!');
        }
      } else {
        showToast('Invalid Roll Number or Password!');
      }
    }

    // Create Account & Save to Firebase + TinyDB
    async function handleSignUp() {
      const name = document.getElementById('reg-name').value.trim();
      const uid = document.getElementById('reg-id').value.trim();
      const classVal = document.getElementById('reg-class').value;
      const pass = document.getElementById('reg-pass').value.trim();

      if (!name || !uid || !pass) { showToast('Fill all fields'); return; }

      toggleProgressBar(true);
      let res = await fetch(`${FIREBASE_URL}/UsersMap/${uid}.json`);
      let existing = await res.json();

      if (existing) {
        toggleProgressBar(false);
        showToast('Account already exists! Please Log In.');
        switchAuthMode('login');
        return;
      }

      currentUser = {
        id: uid,
        roll: uid,
        name: name,
        password: pass,
        classVal: classVal,
        dp: 'https://api.dicebear.com/7.x/micah/svg?seed=' + uid,
        score: 0
      };

      await fetch(`${FIREBASE_URL}/UsersMap/${uid}.json`, { method: 'PUT', body: JSON.stringify(currentUser) });
      toggleProgressBar(false);

      document.getElementById('auth-modal').style.display = 'none';
      document.getElementById('user-badge-status').innerText = name;
      populateProfileForm();
      
      saveUserProfileToDb();
      showToast('Account created & saved successfully!');

      setTimeout(() => {
        if (window.AppInventor && typeof window.AppInventor.setWebViewString === 'function') {
          window.AppInventor.setWebViewString("close_webviewer");
        } else {
          window.WebViewerString = "close_webviewer";
        }
      }, 800);
    }
  </script>
</body>
